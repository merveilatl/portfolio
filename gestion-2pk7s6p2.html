<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Espace de gestion</title><style>:root{--ink:#1d2330;--mut:#6b7280;--pri:#1f3a5f;--ln:#d9dde4;--bg:#f5f6f8}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.lk{max-width:420px;margin:12vh auto;padding:0 18px}.lk h1{font-size:1.6rem;margin:0 0 .4rem}.lk p{color:var(--mut)}.lk input{width:100%;padding:.8rem;border:1px solid var(--ln);border-radius:10px;font-size:1.1rem;margin:.6rem 0}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:#fff;color:var(--ink);padding:.65rem 1rem;border-radius:10px}button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}button:disabled{opacity:.5}
.er{color:#b42318;min-height:1.4em}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--ln);padding:.6rem 12px;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.top b{flex:1;min-width:8rem}
.seg{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:0}.pane-edit{padding:12px 14px 90px;max-width:760px}.pane-prev{display:none;height:calc(100vh - 62px)}.pane-prev iframe{width:100%;height:100%;border:0;background:#fff}
body.v-prev .pane-edit{display:none}body.v-prev .pane-prev{display:block}
@media(min-width:1000px){.main{grid-template-columns:minmax(0,480px) minmax(0,1fr)}.pane-prev{display:block}body.v-prev .pane-edit{display:block}.vtog{display:none}}
h3{margin:1.4rem 0 .4rem;font-size:1.05rem}label.f{display:block;margin:.7rem 0}label.f span{display:block;font-size:.85rem;color:var(--mut);margin-bottom:.2rem}
label.f input[type=text],label.f textarea{width:100%;padding:.6rem;border:1px solid var(--ln);border-radius:8px;font:inherit;background:#fff}label.f textarea{min-height:5.5rem;resize:vertical}label.f.ch input[type=text],label.f.ch textarea{border-color:#b8924a;background:#fffaf0}
.col{display:flex;align-items:center;gap:.7rem}.col input{width:64px;height:44px;padding:0;border:1px solid var(--ln);border-radius:8px;background:#fff}.hint{color:var(--mut);font-size:.9rem}
.box{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;margin:12px 0}.box.ok{border-color:#2a8a4a}.err{color:#b42318}code.cd{display:block;word-break:break-all;max-height:6rem;overflow:auto;background:#f0f1f4;padding:.5rem;border-radius:8px;font-size:.75rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}</style></head><body><div id="app"></div><script>/* CHRISTIFOLIO BUILDER — noyau commun : schéma de données, utilitaires, blocs de rendu partagés */
(function (g) {
  'use strict';
  const CF = (g.CF = g.CF || {});
  CF.VERSION = '1.12.0';
  CF.SELLER = false;/*@s*/
  CF.LICENSEE = "CHRISTINO SERVICES CS";/*@l*/
  CF.MODULES = { shop: true, tpl: true, ai: true, video: true, client: true };/*@m*/
  CF.templates = {};
  CF.registerTemplate = (t) => { CF.templates[t.id] = t; };
  CF.templateList = () => Object.values(CF.templates);

  /* ---------- utilitaires ---------- */
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  const nl = (s) => esc(s).replace(/\r?\n/g, '<br>');
  CF.esc = esc;
  CF.nl = nl;
  CF.uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  CF.clone = (o) => JSON.parse(JSON.stringify(o));
  CF.slugify = (s) =>
    String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'christifolio';
  CF.digits = (s) => String(s || '').replace(/\D/g, '');
  CF.safeUrl = (u) => {
    u = String(u || '').trim();
    if (!u) return '';
    if (/^(https?:|mailto:|tel:)/i.test(u)) return u;
    if (/^[a-z][a-z0-9+.-]*:/i.test(u) || /^\/\//.test(u)) return '';
    return 'https://' + u.replace(/^\/+/, '');
  };

  /* ---------- couleurs ---------- */
  const HEX = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
  const col = (v, f) => (HEX.test(String(v || '').trim()) ? String(v).trim() : f);
  CF.col = col;
  CF.hex6 = (v, f) => {
    v = col(v, f || '#000000');
    return v.length === 4 ? '#' + v.slice(1).split('').map((c) => c + c).join('') : v;
  };
  const rgb = (h) => {
    h = CF.hex6(h).slice(1);
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  CF.contrast = (hex) => {
    const [r, g2, b] = rgb(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * r + 0.7152 * g2 + 0.0722 * b > 0.5 ? '#111111' : '#ffffff';
  };
  CF.alpha = (hex, a) => { const [r, g2, b] = rgb(hex); return 'rgba(' + r + ',' + g2 + ',' + b + ',' + a + ')'; };

  /* ---------- polices & palettes ---------- */
  CF.FONTS = {
    'Playfair Display': "'Playfair Display', Georgia, serif",
    'Cormorant Garamond': "'Cormorant Garamond', Georgia, serif",
    'Lora': "'Lora', Georgia, serif",
    'Poppins': "'Poppins', system-ui, sans-serif",
    'Montserrat': "'Montserrat', system-ui, sans-serif",
    'Inter': "'Inter', system-ui, sans-serif",
    'DM Sans': "'DM Sans', system-ui, sans-serif",
    'Manrope': "'Manrope', system-ui, sans-serif",
    'Space Grotesk': "'Space Grotesk', system-ui, sans-serif",
    'Syne': "'Syne', system-ui, sans-serif",
    'Raleway': "'Raleway', system-ui, sans-serif",
    'Sora': "'Sora', system-ui, sans-serif",
  };
  CF.fontStack = (n) => CF.FONTS[n] || CF.FONTS.Inter;
  CF.fontsHref = (des) => {
    const names = [...new Set([des.fontHeading, des.fontBody])].filter((n) => CF.FONTS[n]);
    return 'https://fonts.googleapis.com/css2?' + names.map((n) => 'family=' + n.replace(/ /g, '+') + ':wght@400;500;600;700;800').join('&') + '&display=swap';
  };
  CF.PALETTES = [
    { name: 'Marine & or', colors: { primary: '#1f3a5f', accent: '#b8924a', bg: '#ffffff', surface: '#f5f3ee', text: '#1d2330', muted: '#6b7280' } },
    { name: 'Forêt', colors: { primary: '#1f5d46', accent: '#d9a441', bg: '#fbfaf5', surface: '#eff3ec', text: '#18221d', muted: '#62705f' } },
    { name: 'Bordeaux', colors: { primary: '#7b1e3a', accent: '#d4a373', bg: '#fffaf7', surface: '#f7ece8', text: '#2a1a1d', muted: '#7a6a6c' } },
    { name: 'Océan', colors: { primary: '#0b6e99', accent: '#f4a261', bg: '#ffffff', surface: '#eef6fa', text: '#10222c', muted: '#5f7480' } },
    { name: 'Corail', colors: { primary: '#ff5a36', accent: '#3a2cff', bg: '#fffaf3', surface: '#ffffff', text: '#14110f', muted: '#6e6a64' } },
    { name: 'Violet', colors: { primary: '#6d28d9', accent: '#f59e0b', bg: '#fbfaff', surface: '#f1ecfc', text: '#1b1530', muted: '#6b6485' } },
    { name: 'Noir & or', colors: { primary: '#f2f2f0', accent: '#c8a96a', bg: '#0d0d0f', surface: '#151518', text: '#f2f2f0', muted: '#8b8b92' } },
    { name: 'Ardoise', colors: { primary: '#38bdf8', accent: '#fbbf24', bg: '#0f172a', surface: '#1e293b', text: '#e2e8f0', muted: '#94a3b8' } },
    { name: 'Terracotta', colors: { primary: '#b5472b', accent: '#f2b84b', bg: '#fffaf4', surface: '#faeee2', text: '#2b1d16', muted: '#7d6a5f' } },
  ];

  /* ---------- icônes ---------- */
  const P = {
    whatsapp: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
    phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    facebook: '<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
    instagram: '<rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>',
    linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
    twitter: '<path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/>',
    youtube: '<path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/>',
    tiktok: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    website: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  };
  CF.icon = (k, s) => '<svg viewBox="0 0 24 24" width="' + (s || 20) + '" height="' + (s || 20) + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (P[k] || '') + '</svg>';

  /* ---------- schéma de données ---------- */
  CF.LIST_KEYS = ['services', 'skills', 'experiences', 'education', 'certifications', 'projects', 'testimonials', 'languages', 'qualities', 'interests', 'customSections'];

  CF.newPortfolio = (label, templateId) => {
    const t = CF.templates[templateId] || CF.templates.elegant || CF.templateList()[0];
    const now = Date.now();
    return {
      id: CF.uid(), label: label || 'Nouveau Christifolio', template: t ? t.id : 'elegant',
      status: 'draft', createdAt: now, updatedAt: now, exportedAt: null,
      profile: { firstName: '', lastName: '', brandName: '', title: '', titles: [], tagline: '', bio: '', signature: '', location: '', photo: '', logo: '', cover: '' },
      services: [], skills: [], experiences: [], education: [], certifications: [], projects: [], testimonials: [], languages: [], qualities: [], interests: [], customSections: [],
      contact: { email: '', phone: '', whatsapp: '', whatsappMessage: 'Bonjour, je vous contacte depuis votre site.', address: '', map: '', mapEmbed: true, website: '', facebook: '', instagram: '', linkedin: '', twitter: '', youtube: '', tiktok: '', heading: '', intro: '', button: '' },
      layout: { order: [], names: {} },
      design: Object.assign(CF.clone(t ? t.defaults : {}), { hidden: {} }),
      seo: { title: '', description: '' },
      images: {},
      shop: CF.shop ? CF.shop.blank() : undefined, /* Boutique : facultative, désactivée par défaut */
      video: CF.video ? CF.video.blank() : undefined,
      client: CF.client ? CF.client.blank() : undefined,
    };
  };

  CF.normalize = (p) => {
    p = p || {};
    const base = CF.newPortfolio(p.label, p.template);
    const out = Object.assign({}, base, p);
    out.profile = Object.assign({}, base.profile, p.profile);
    out.contact = Object.assign({}, base.contact, p.contact);
    if (!Array.isArray(out.profile.titles)) out.profile.titles = [];
    out.seo = Object.assign({}, base.seo, p.seo);
    out.design = Object.assign({}, base.design, p.design);
    out.design.palette = Object.assign({}, base.design.palette, (p.design || {}).palette);
    out.design.hidden = Object.assign({}, (p.design || {}).hidden);
    const lay = p.layout && typeof p.layout === 'object' ? p.layout : {};
    out.layout = {
      order: Array.isArray(lay.order) ? lay.order.filter((x) => typeof x === 'string').slice(0, 60) : [],
      names: lay.names && typeof lay.names === 'object' && !Array.isArray(lay.names) ? lay.names : {},
    };
    CF.LIST_KEYS.forEach((k) => { if (!Array.isArray(out[k])) out[k] = []; });
    out.images = p.images && typeof p.images === 'object' ? p.images : {};
    if (CF.shop) out.shop = CF.shop.normalize(p.shop);
    if (CF.video) out.video = CF.video.normalize(p.video);
    if (CF.client) out.client = CF.client.normalize(p.client);
    if (!CF.templates[out.template]) out.template = base.template;
    return out;
  };

  CF.usedImages = (d) => {
    const ids = [];
    ['photo', 'logo', 'cover'].forEach((k) => d.profile[k] && ids.push(d.profile[k]));
    d.projects.forEach((p) => p.image && ids.push(p.image));
    d.services.forEach((s) => s.image && ids.push(s.image));
    if (CF.shop) CF.shop.exportImages(d).forEach((id) => ids.push(id)); /* uniquement si la boutique est affichée */
    return [...new Set(ids)].filter((id) => d.images[id]);
  };
  /* images à garder dans le brouillon : celles du site + celles de la boutique, même désactivée */
  CF.keptImages = (d) => [...new Set(CF.usedImages(d).concat(CF.shop ? CF.shop.keptImages(d) : []))].filter((id) => d.images[id]);

  /* ---------- dates du parcours (jj/mm/aaaa) et niveau facultatif ---------- */
  CF.fmtDate = (iso, prec) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return String(iso || '');
    if (prec === 'year') return m[1];
    if (prec === 'month') return m[2] + '/' + m[1];
    return m[3] + '/' + m[2] + '/' + m[1];
  };
  CF.period = (x) => {
    if (!x.start && !x.end && !x.current) return x.period || '';
    const s = CF.fmtDate(x.start, x.prec), e = x.current ? "Aujourd'hui" : CF.fmtDate(x.end, x.prec);
    return s && e ? s + ' – ' + e : (s || e);
  };
  CF.certDate = (x) => (x.date ? CF.fmtDate(x.date, x.prec) : (x.year || ''));
  CF.hasLevel = (s) => s.level !== '' && s.level != null && !isNaN(+s.level);

  CF.fullName = (d) => [d.profile.firstName, d.profile.lastName].filter(Boolean).join(' ').trim();
  CF.initials = (d) => ((d.profile.firstName || '').charAt(0) + (d.profile.lastName || '').charAt(0)).toUpperCase() || '·';

  /* ---------- images ---------- */
  CF.dataUrlToBytes = (du) => {
    const i = du.indexOf(',');
    const mime = (du.slice(0, i).match(/:(.*?);/) || [])[1] || 'application/octet-stream';
    const bin = atob(du.slice(i + 1));
    const bytes = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    return { bytes, mime };
  };
  const blobCache = new Map();
  CF.blobUrl = (id, du) => {
    if (!blobCache.has(id)) {
      try { const r = CF.dataUrlToBytes(du); blobCache.set(id, URL.createObjectURL(new Blob([r.bytes], { type: r.mime }))); }
      catch (e) { blobCache.set(id, du); }
    }
    return blobCache.get(id);
  };
  CF.previewCtx = (d) => ({ preview: true, vid: (id) => (CF.video ? CF.video.url(id) : ''), img: (id) => (id && d.images[id] ? CF.blobUrl(id, d.images[id]) : '') });

  /* Lecture d'une image : plusieurs méthodes de secours (photos lourdes, formats rares, fichiers de téléphone) */
  CF.processImage = async (file, o) => {
    const load = (url) => new Promise((ok, no) => {
      const i = new Image();
      i.onload = () => ok(i);
      i.onerror = () => no(new Error('decode'));
      i.src = url;
    });
    const readURL = (f) => new Promise((ok, no) => {
      const r = new FileReader();
      r.onload = () => ok(r.result);
      r.onerror = () => no(r.error || new Error('read'));
      r.readAsDataURL(f);
    });
    const draw = (src, sw, sh) => {
      const k = Math.min(1, o.max / Math.max(sw, sh));
      const w = Math.max(1, Math.round(sw * k)), h = Math.max(1, Math.round(sh * k));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const cx = cv.getContext('2d');
      if (o.type === 'image/jpeg') { cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, w, h); }
      cx.drawImage(src, 0, 0, w, h);
      const out = cv.toDataURL(o.type, o.q || 0.82);
      if (!out || out.length < 200) throw new Error('canvas');
      return out;
    };
    /* 1. élément <img> via une adresse temporaire */
    const url = URL.createObjectURL(file);
    try {
      const img = await load(url);
      return draw(img, img.naturalWidth || o.max, img.naturalHeight || o.max);
    } catch (e) { /* méthode suivante */ } finally { URL.revokeObjectURL(url); }
    /* 2. décodeur du navigateur (createImageBitmap) */
    if (window.createImageBitmap) {
      try {
        const bm = await createImageBitmap(file);
        try { return draw(bm, bm.width, bm.height); } finally { if (bm.close) bm.close(); }
      } catch (e) { /* méthode suivante */ }
    }
    /* 3. lecture complète du fichier puis décodage */
    try {
      const img = await load(await readURL(file));
      return draw(img, img.naturalWidth || o.max, img.naturalHeight || o.max);
    } catch (e) { /* abandon */ }
    const err = new Error('Image illisible');
    err.heic = /hei[cf]/i.test((file.type || '') + ' ' + (file.name || ''));
    throw err;
  };

  /* ---------- vue normalisée pour les modèles ---------- */
  CF.waLink = (c) => {
    const n = CF.digits(c.whatsapp);
    if (!n) return '';
    return 'https://wa.me/' + n + (c.whatsappMessage ? '?text=' + encodeURIComponent(c.whatsappMessage) : '');
  };
  CF.socials = (c) => [
    ['facebook', 'Facebook'], ['instagram', 'Instagram'], ['linkedin', 'LinkedIn'], ['twitter', 'X / Twitter'],
    ['youtube', 'YouTube'], ['tiktok', 'TikTok'], ['website', 'Site web'],
  ].map(([k, l]) => ({ key: k, label: l, url: CF.safeUrl(c[k]) })).filter((s) => s.url);

  CF.SECTION_ORDER = ['about', 'services', 'skills', 'qualities', 'languages', 'parcours', 'projects', 'testimonials', 'interests', 'contact'];
  CF.NAV_LABELS = { videos: 'Vidéos', hero: 'Identité (présentation)', about: 'À propos', services: 'Services', skills: 'Compétences', qualities: 'Qualités', languages: 'Langues', parcours: 'Parcours', projects: 'Réalisations', testimonials: 'Témoignages', interests: "Centres d'intérêt", contact: 'Contact', shop: 'Boutique' };
  /* sections supplémentaires (même rendu dans tous les modèles : chaque modèle fournit seulement l'enveloppe) */
  CF.EXTRA_DEFS = {
    qualities: { kicker: 'Atouts', title: 'Mes qualités' },
    languages: { kicker: 'Communication', title: 'Langues' },
    interests: { kicker: 'En dehors du travail', title: "Centres d'intérêt" },
  };
  CF.customId = (s) => 'x-' + String(s && s.id || '').replace(/[^\w-]/g, '');
  CF.extraHtml = (k, d) => {
    if (k === 'languages') return '<div class="xlangs">' + d.languages.filter((x) => x.name).map((l) => '<div class="xlang"><b>' + esc(l.name) + '</b>' + (l.level ? '<span>' + esc(l.level) + '</span>' : '') + '</div>').join('') + '</div>';
    return '<div class="xchips">' + d[k].filter((x) => x.name).map((x) => '<span class="xchip">' + esc(x.name) + '</span>').join('') + '</div>';
  };
  CF.customHtml = (s) => {
    const paras = String(s.text || '').split(/\n{2,}/).filter((x) => x.trim()).map((x) => '<p>' + nl(x) + '</p>').join('');
    const items = String(s.items || '').split(/\n+/).map((x) => x.replace(/^[\s•\-–*]+/, '').trim()).filter(Boolean);
    return '<div class="xtext">' + paras + (items.length ? '<ul class="xlist">' + items.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') + '</div>';
  };

  /* Position sur la carte : lien Google Maps, coordonnées, code « Intégrer une carte » ou simple adresse */
  CF.mapInfo = (c) => {
    const raw = String((c && c.map) || '').trim();
    if (!raw) return null;
    const search = (q) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
    const okEmbed = (u) => {
      try { const x = new URL(u); return x.protocol === 'https:' && ((x.hostname === 'www.google.com' && x.pathname.indexOf('/maps') === 0) || x.hostname === 'maps.google.com' || (x.hostname === 'www.openstreetmap.org' && x.pathname === '/export/embed.html')); } catch (e) { return false; }
    };
    let link = '', embed = '', m;
    if ((m = /<iframe[^>]*\ssrc\s*=\s*["']([^"']+)["']/i.exec(raw))) {
      const u = m[1].replace(/&amp;/g, '&');
      if (okEmbed(u)) { embed = u; link = c.address ? search(c.address) : u; }
    } else if ((m = /^(-?\d{1,2}(?:\.\d+)?)\s*[,;]\s*(-?\d{1,3}(?:\.\d+)?)$/.exec(raw)) && Math.abs(+m[1]) <= 90 && Math.abs(+m[2]) <= 180) {
      const q = m[1] + ',' + m[2];
      link = search(q); embed = 'https://www.google.com/maps?q=' + encodeURIComponent(q) + '&z=15&output=embed';
    } else if (/^https?:\/\//i.test(raw)) {
      link = CF.safeUrl(raw);
      if (okEmbed(link) && /output=embed|\/maps\/embed|export\/embed/.test(link)) embed = link;
    } else if (!/^[a-z][a-z0-9+.-]*:/i.test(raw)) {
      link = search(raw.slice(0, 300));
    }
    if (!link) return null;
    return { link, embed: c.mapEmbed === false ? '' : embed };

  CF.mapEmbedHtml = (v) => (v.map && v.map.embed

  /* Liste des sections dans l'ordre choisi (ordre du modèle par défaut, sections perso avant Contact) */
  CF.coreOrder = ['about', 'services', 'skills', 'qualities', 'languages', 'parcours', 'projects', 'testimonials', 'interests'];
  CF.sectionOrder = (d, defCore, all) => {
    const customs = (d.customSections || []).filter((x) => x.title && (all || x.text || x.items)).map(CF.customId);
    const base = ['hero'].concat(defCore || CF.coreOrder).concat(customs, d.shop && d.shop.enabled ? ['shop'] : [], CF.video && CF.video.has(d) ? ['videos'] : [], ['contact']);
    const saved = ((d.layout && d.layout.order) || []).filter((id, i, a) => base.indexOf(id) >= 0 && a.indexOf(id) === i);
    if (!saved.length) return base;
    const rest = base.filter((id) => saved.indexOf(id) < 0), out = saved.slice();
    rest.forEach((id) => { const ci = out.indexOf('contact'); if (id === 'hero') out.unshift(id); else if (id === 'contact' || ci < 0) out.push(id); else out.splice(ci, 0, id); });
    return out;
  };
  /* noms personnalisés (menu, sur-titre, titre), nettoyés */
  CF.sectionNames = (d) => {
    const src = (d.layout && d.layout.names) || {}, out = {};

      const o = src[id]; if (!o || typeof o !== 'object') return;
      const f = (x, n) => String(x == null ? '' : x).replace(/\s+/g, ' ').trim().slice(0, n);
      const r = { nav: f(o.nav, 26), kicker: f(o.kicker, 60), title: f(o.title, 80) };
      if (r.nav || r.kicker || r.title) out[id] = r;

    return out;
  };

    return v.order.filter((id) => v.show[id] && blk[id]).map((id) => blk[id]()).join('');

  CF.view = (d, ctx, defCore) => {

    CF.SECTION_ORDER.forEach((k) => { show[k] = !!has[k] && !hid[k]; });
    customs.forEach((x) => { const id = CF.customId(x); show[id] = !hid[id]; labels[id] = String(x.title).slice(0, 26); });
    if (d.shop && d.shop.enabled && CF.shop) { /* Boutique : section ajoutée seulement si activée et non vide */

    return {

      brand: brand || CF.fullName(d) || 'Votre nom',

      texts, render: build(spec),

  T.idOf = idOf;

  T.rename = async (id, name) => { const s = T.specs.find((x) => idOf(x) === id); if (!s) return id; delete CF.templates[id]; T.specs = T.specs.filter((x) => x !== s); s.nom = String(name || '').trim().slice(0, 30) || s.nom; const n = T.register(s); await save(); return n; };
  T.load = async () => { let l = []; try { l = (await CF.db.getMeta('customTemplates')) || []; } catch (e) { l = []; } (Array.isArray(l) ? l : []).forEach((s) => { try { T.register(s); } catch (e) { /* modèle illisible ignoré */ } }); };
  /* import depuis une sauvegarde : revérifie chaque modèle comme un JSON collé */
  T.importMany = async (arr) => { let n = 0; for (const s of (Array.isArray(arr) ? arr : [])) { try { const r = T.parse(JSON.stringify(Object.assign({ 'christifolio-modele': { version: 1 } }, s))); r.spec.uid = String(s.uid || '').replace(/\W/g, '').slice(0, 8) || undefined; if (!T.specs.some((x) => x.uid === r.spec.uid)) { T.register(r.spec); n++; } } catch (e) { /* ignoré */ } } if (n) await save(); return n; };
})(window);

      const cur = F.filter((f) => CF.client.tabOf(f) === tab), groups = [];

      const inp = (f) => {
        const ch = vals[f.k] !== orig[f.k] ? ' ch' : '';
        if (f.t === 'color') return '<label class="f"><span>' + esc(f.l) + '</span><div class="col"><input type="color" data-k="' + esc(f.k) + '" value="' + esc(vals[f.k]) + '"><small class="hint">' + esc(vals[f.k]) + '</small></div></label>';
        if (f.t === 'area') return '<label class="f' + ch + '"><span>' + esc(f.l) + '</span><textarea data-k="' + esc(f.k) + '" maxlength="' + f.max + '">' + esc(vals[f.k]) + '</textarea></label>';
        return '<label class="f' + ch + '"><span>' + esc(f.l) + '</span><input type="text" data-k="' + esc(f.k) + '" maxlength="' + f.max + '" value="' + esc(vals[f.k]) + '"' + (f.t === 'link' ? ' inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://…"' : '') + '></label>';
      };
      return '<div class="seg">' + [['textes', 'Textes'], ['liens', 'Liens'], ['couleurs', 'Couleurs']].map(([k, l]) => '<button data-tab="' + k + '" class="' + (tab === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div>' +
        (tab === 'couleurs' ? '<p class="hint">Choisissez les couleurs de votre site. L\'aperçu se met à jour tout de suite.</p>' : '') +
        groups.map((g) => '<h3>' + esc(g.n) + '</h3>' + g.f.map(inp).join('')).join('');
    }
    function draw() {
      const n = changed().length;
      app.innerHTML = '<div class="top"><b>' + esc(P.name) + '</b><button class="vtog" id="vt">Voir mon site</button><button class="pri" id="send">Valider mes modifications' + (n ? ' (' + n + ')' : '') + '</button></div>' +
        '<div class="main"><div class="pane-edit"><div id="form">' + html() + '</div><div id="res"></div></div><div class="pane-prev"><iframe id="pv" title="Aperçu de votre site"></iframe></div></div>';
      $('#form').addEventListener('input', (e) => { const k = e.target.dataset.k; if (!k) return; vals[k] = e.target.value; if (e.target.type === 'color') e.target.nextElementSibling.textContent = e.target.value; const lb = e.target.closest('label'); if (lb) lb.classList.toggle('ch', vals[k] !== orig[k]); saveDraft(); upd(); });
      $('#form').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; $('#form').innerHTML = html(); });
      $('#vt').addEventListener('click', () => { document.body.classList.toggle('v-prev'); $('#vt').textContent = document.body.classList.contains('v-prev') ? 'Retour à la modification' : 'Voir mon site'; preview(); });
      $('#send').addEventListener('click', send);
      preview();
    }
    function upd() { const n = changed().length; $('#send').textContent = 'Valider mes modifications' + (n ? ' (' + n + ')' : ''); clearTimeout(timer); timer = setTimeout(preview, 450); }
    function preview() {
      const d = CF.clone(D); F.forEach((f) => { if (vals[f.k] !== orig[f.k]) { const v = CF.client.validate(f, vals[f.k]); if (v !== null) CF.client.set(d, f.k, v); } });
      try { $('#pv').srcdoc = CF.render(d, { preview: true, img: (id) => P.img[id] || '', vid: (id) => P.vid[id] || '', favicon: '' }); } catch (e) { /* ignore */ }
    }
    function send() {
      const ch = changed(), res = $('#res'), changes = {}, bad = [];
      if (!ch.length) { res.innerHTML = '<div class="box"><b>Aucune modification pour l\'instant.</b><p class="hint">Changez un texte, un lien ou une couleur, puis revenez ici.</p></div>'; return; }
      ch.forEach((f) => { const v = CF.client.validate(f, vals[f.k]); if (v === null) bad.push(f.l); else changes[f.k] = v; });
      if (bad.length) { res.innerHTML = '<div class="box"><b class="err">Certaines valeurs ne sont pas valides :</b><ul>' + bad.map((b) => '<li>' + esc(b) + '</li>').join('') + '</ul><p class="hint">Corrigez-les (lien complet, e-mail ou numéro valide, texte pas trop long) puis validez à nouveau.</p></div>'; return; }
      const code = CF.client.pack(P.site, changes), msg = 'Bonjour, voici mes modifications pour mon site :\n\n' + code;
      const wa = P.wa ? 'https://wa.me/' + P.wa + (encodeURIComponent(msg).length <= 3800 ? '?text=' + encodeURIComponent(msg) : '') : '';
      const mail = P.mail ? 'mailto:' + P.mail + '?subject=' + encodeURIComponent('Modifications de mon site') + (encodeURIComponent(msg).length <= 1800 ? '&body=' + encodeURIComponent(msg) : '') : '';
      res.innerHTML = '<div class="box ok"><b>Vos modifications sont prêtes (' + ch.length + ').</b><p>Envoyez-les maintenant : elles seront <b>publiées après vérification</b>.</p><div class="row">' +
        (wa ? '<a href="' + esc(wa) + '" target="_blank" rel="noopener"><button class="pri" type="button">Envoyer par WhatsApp</button></a>' : '') +
        (mail ? '<a href="' + esc(mail) + '"><button type="button">Envoyer par e-mail</button></a>' : '') +
        '<button type="button" id="cp">Copier le code</button></div>' +
        '<p class="hint" id="cpn">Si le message ne contient pas le code, copiez-le puis collez-le dans la conversation.</p><code class="cd">' + esc(code) + '</code></div>';
      $('#cp').addEventListener('click', async () => { try { await navigator.clipboard.writeText(msg); $('#cpn').textContent = 'Code copié : collez-le dans votre message.'; } catch (e) { $('#cpn').textContent = 'Copie impossible : sélectionnez le code ci-dessous à la main.'; } });
      res.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    lock('');
  })();</script></body></html>
